<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
       
    
<style>
    body {
        background-color: #111;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background-image: url('image.jpg');}
        

    .container {
        background-color: #f2efef;
        border: 2px solid #f1e5e5;
        display: flex;
        justify-content: center;
        gap: 10px;
        padding: 20px;
        border-radius: 15px;
        background-image: url('image.jpg');
    }

    .item {
        width: 64px;
        height: 40px;
background-image: url(image.jpg);
        display: flex;
        align-items: center;
        justify-content: center;
    padding: 10px;

        border: 2px solid #e6e9e1;
        border-radius: 12px;
color:#f8e6e6;
        background-color: #cdb9d8;

        font-size: large;
        font-weight: bold;

        text-shadow: 1px 2px 5px #f7f0f0;
        box-shadow: 2px 3px 8px #f0ebf3;

        transition: 0.3s;
    }

    .item:hover {
        transform: translateY(-5px);
        background-color:#f2f5f1;
        box-shadow: 3px 6px 12px #e42a1a;
    }
</style>

    
</head>

<body>
    
    <main>
    <div class="container">
    <div class="item">HOME</div>
    <div class="item">ABOUT</div                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
    <div class="item">CONTACT</div>
    <div class="item">EMAIL</div>
    <div class="item">HELP</div>
    </div>
    </main>
</body>
</html>
